<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="preload" as="font" href="{{rootPath}}assets/fonts/montserrat-variable-cyrillic.woff2" type="font/woff2" crossorigin>
    <link rel="preload" as="font" href="{{rootPath}}assets/fonts/source-sans-3-variable-cyrillic.woff2" type="font/woff2" crossorigin>
    <link rel="preload" as="font" href="{{rootPath}}assets/fonts/montserrat-variable-latin.woff2" type="font/woff2" crossorigin>
    <link rel="preload" as="font" href="{{rootPath}}assets/fonts/source-sans-3-variable-latin.woff2" type="font/woff2" crossorigin>
    {{internalStyles}}
    <link rel="preload" as="style" href="{{rootPath}}assets/css/certificates.css?v={{assetVersion}}">
    <link rel="stylesheet" href="{{rootPath}}assets/css/certificates.css?v={{assetVersion}}" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="{{rootPath}}assets/css/certificates.css?v={{assetVersion}}"></noscript>
  </head>
  <body class="certificates-page">
    <main id="main-content" tabindex="-1">
      <section class="certificates-hero" aria-labelledby="internal-page-title">
        <a class="skip-link" href="#internal-page-title">К основному содержанию</a>
        <div class="site-header-rail">{{v3-header}}</div>
        <div class="container certificates-hero__inner">
          {{breadcrumbs}}
          <h1 id="internal-page-title">{{h1}}</h1>
        </div>
      </section>
      {{sections}}
    </main>
    {{v3-footer}}
    {{mobile-callbar}}
    {{media-viewer}}
    {{companyMediaData}}
    <script src="{{rootPath}}assets/js/main.js?v={{assetVersion}}" defer></script>
    <script src="{{rootPath}}assets/js/company.js?v={{assetVersion}}" defer></script>
  </body>
</html>
