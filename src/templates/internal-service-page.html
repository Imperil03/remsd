<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{title}}</title>
    <meta name="description" content="{{description}}">
    <link rel="canonical" href="{{canonicalUrl}}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:site_name" content="РемСД">
    <meta property="og:title" content="{{socialTitle}}">
    <meta property="og:description" content="{{socialDescription}}">
    <meta property="og:url" content="{{canonicalUrl}}">
    <meta property="og:image" content="{{ogImage}}">
    <meta property="og:image:alt" content="{{ogImageAlt}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{socialTitle}}">
    <meta name="twitter:description" content="{{socialDescription}}">
    <meta name="twitter:image" content="{{ogImage}}">
    <meta name="twitter:image:alt" content="{{ogImageAlt}}">
    <link rel="preload" as="image" href="{{heroImageSrc}}" type="image/webp" fetchpriority="high">
    <link rel="preload" as="font" href="{{rootPath}}assets/fonts/montserrat-cyrillic-800-normal.woff2" type="font/woff2" crossorigin>
    <link rel="preload" as="font" href="{{rootPath}}assets/fonts/source-sans-3-cyrillic-400-normal.woff2" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{rootPath}}assets/css/styles.css?v={{assetVersion}}">
    <link rel="stylesheet" href="{{rootPath}}assets/css/styles-v3.css?v={{assetVersion}}">
    <link rel="stylesheet" href="{{rootPath}}assets/css/internal-service.css?v={{assetVersion}}">
    <script type="application/ld+json">
{{structuredData}}
    </script>
  </head>
  <body class="dossier-page">
    <!--
    THESIS: A repair page behaves as a technical dossier, refusing the generic stack of equal marketing cards.
    OWN-WORLD: Industrial navy fields, cool paper, real workshop photography, dense Montserrat headings, Source Sans reading text, thin engineering rules and rare signal yellow.
    STORY: The visitor identifies the repair scope, scans systems and symptoms, verifies brands, process and base, then calls the master.
    FIRST VIEWPORT: Shared white header over a framed dark split hero; copy and one yellow phone action left, decisive workshop image right.
    FORM: Technical dossier, selected structure 1/3; seed user-pinned-technical-dossier-20260820.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
    -->
    <a class="dossier-skip-link" href="#main-content">Перейти к содержанию</a>
    {{header}}

    <main id="main-content" tabindex="-1">
      <section class="dossier-hero" aria-labelledby="dossier-title">
        <div class="container dossier-hero__frame">
          <nav class="dossier-breadcrumbs" aria-label="Хлебные крошки">
{{breadcrumbs}}
          </nav>

          <div class="dossier-hero__grid">
            <div class="dossier-hero__copy">
              <h1 id="dossier-title">{{h1}}</h1>
              <p>{{lead}}</p>
              <a class="dossier-button dossier-button--primary" href="tel:+79224488822">{{heroCtaLabel}}</a>
            </div>

            <figure class="dossier-hero__media">
              <img src="{{heroImageSrc}}" alt="{{heroImageAlt}}" width="{{heroImageWidth}}" height="{{heroImageHeight}}" fetchpriority="high" decoding="async">
              <figcaption>{{heroImageCaption}}</figcaption>
            </figure>
          </div>
        </div>
      </section>

      <div class="container dossier-mobile-contents">
        <details>
          <summary>Содержание страницы</summary>
          <nav aria-label="Содержание страницы для мобильных устройств">
{{tocMobile}}
          </nav>
        </details>
      </div>

      <div class="container dossier-layout">
        <aside class="dossier-sidebar">
          <nav class="dossier-contents" aria-label="Содержание страницы">
            <p>Содержание страницы</p>
{{tocDesktop}}
            <a class="dossier-contents__call" href="tel:+79224488822">Позвонить мастеру</a>
          </nav>
        </aside>

        <article class="dossier-content">
{{sections}}
        </article>
      </div>

{{finalCta}}
    </main>

    {{media-lightbox}}
    {{v3-footer}}
    {{mobile-callbar}}

    <script src="{{rootPath}}assets/js/main.js?v={{assetVersion}}"></script>
  </body>
</html>
