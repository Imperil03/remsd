<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Страница не найдена — РемСД</title>

        <div class="page-hero__actions">
          <a class="button button--primary" href="{{rootPath}}remont-gruzovyh-avtomobiley/">Ремонт грузовых автомобилей</a>
          <a class="button button--secondary" href="{{rootPath}}">На главную</a>
        </div>
      </div>

    {{v3-footer}}
    {{mobile-callbar}}
    <script src="{{rootPath}}assets/js/main.js?v={{assetVersion}}" defer></script>
